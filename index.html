<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Card Catalog — Library Circulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="drawer">

    <header class="plate">
      <div class="plate-stamp">CIRCULATION<br />DESK OPEN</div>
      <h1>The Card Catalog</h1>
      <p>Track what's in, what's out, and what's on the shelf.</p>
    </header>

    <main class="floor">

      <!-- SHELF: current holdings -->
      <section class="shelf" aria-label="Current shelf">
        <div class="shelf-head">
          <h2>On the shelf</h2>
          <span class="shelf-count" id="shelfCount">0 titles</span>
        </div>
        <div class="cards" id="cardGrid"></div>
      </section>

      <!-- CIRCULATION DESK -->
      <section class="desk" aria-label="Circulation desk">

        <div class="tabs" role="tablist" id="tabs">
          <button class="tab is-active" data-panel="issue" role="tab" aria-selected="true">Issue a book</button>
          <button class="tab" data-panel="return" role="tab" aria-selected="false">Return a book</button>
          <button class="tab" data-panel="add" role="tab" aria-selected="false">Add a book</button>
        </div>

        <!-- ISSUE -->
        <form class="panel is-active" id="panel-issue" data-panel="issue">
          <label for="issueSelect">Which book is going out?</label>
          <select id="issueSelect" required></select>
          <button type="submit" class="btn btn-stamp">Issue book</button>
        </form>

        <!-- RETURN -->
        <form class="panel" id="panel-return" data-panel="return">
          <label for="returnInput">Which book is coming back?</label>
          <input type="text" id="returnInput" list="knownTitles" placeholder="Type the exact title" required />
          <button type="submit" class="btn btn-stamp">Return book</button>
        </form>

        <!-- ADD -->
        <form class="panel" id="panel-add" data-panel="add">
          <label for="addTitle">New or existing title</label>
          <input type="text" id="addTitle" list="knownTitles" placeholder="e.g. Deep Learning" required />
          <label for="addQty">Copies to add</label>
          <input type="number" id="addQty" min="1" value="1" required />
          <button type="submit" class="btn btn-stamp">Add to shelf</button>
        </form>

        <datalist id="knownTitles"></datalist>

        <div class="ledger" aria-label="Ledger">
          <div class="ledger-head">Ledger</div>
          <ul id="ledgerList"></ul>
        </div>

      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
